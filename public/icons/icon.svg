<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1E35" />
      <stop offset="50%" stop-color="#071526" />
      <stop offset="100%" stop-color="#040D18" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8C33" />
      <stop offset="60%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#D94E00" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA154" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#163558" stroke-width="8" opacity="0.6" />

  <!-- Center Vault Hexagon / Cube Box 3D -->
  <!-- Top Cube / Box -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Back Shelf Kallax grid / 3D Isometric Boardgame Stack -->
    <!-- Top Face -->
    <polygon points="0,-140 130,-65 0,10 -130,-65" fill="url(#orangeGrad)" />
    <!-- Left Face -->
    <polygon points="-130,-65 0,10 0,160 -130,85" fill="#C44400" />
    <!-- Right Face -->
    <polygon points="0,10 130,-65 130,85 0,160" fill="#9E3500" />

    <!-- Isometric Dice Pips / Kallax Grids on Top Face -->
    <circle cx="0" cy="-65" r="14" fill="#FFFFFF" opacity="0.95" />
    <circle cx="-55" cy="-97" r="12" fill="#FFFFFF" opacity="0.95" />
    <circle cx="55" cy="-33" r="12" fill="#FFFFFF" opacity="0.95" />
    <circle cx="-55" cy="-33" r="12" fill="#FFFFFF" opacity="0.95" />
    <circle cx="55" cy="-97" r="12" fill="#FFFFFF" opacity="0.95" />

    <!-- Left side Real Shield Emblem -->
    <path d="M -80,20 L -50,38 L -50,75 Q -50,95 -80,110 Q -110,95 -110,75 L -110,38 Z" fill="#10B981" opacity="0.9" />
    <polyline points="-95,65 -85,75 -65,55" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Right side Fake Alert Triangle -->
    <path d="M 80,25 L 115,85 L 45,85 Z" fill="#F43F5E" opacity="0.9" />
    <rect x="77" y="47" width="6" height="20" rx="3" fill="#FFFFFF" />
    <circle cx="80" cy="76" r="3.5" fill="#FFFFFF" />
  </g>

  <!-- Sparkle top right -->
  <path d="M 400,100 Q 400,120 420,120 Q 400,120 400,140 Q 400,120 380,120 Q 400,120 400,100 Z" fill="#FFA154" />
</svg>